  $('#main').innerHTML = `
  <section class="board view">
    <div class="board-head">
      <div><p class="eyebrow">История</p><h1 class="h-page">Твои бои</h1></div>
      <div class="summary" id="hSum"></div>
    </div>
    <ol class="rows" id="hRows">${'<li class="skel"></li>'.repeat(5)}</ol>
  </section>`;
  try {
    const uid = S.user.id, rows = await Net.history(uid);
    const ol = $('#hRows'); if (!ol || S.view !== 'history') return;
    if (!rows.length) { ol.outerHTML = `<div class="empty-state"><b>Боёв пока нет</b><span>Включи камеру и жми «В бой». Соперник подбирается в пределах ±${CONFIG.ELO_RANGE} ELO.</span><button class="btn primary sm" onclick="document.querySelector('[data-go=arena]').click()">В арену</button></div>`; return; }
    let w = 0;
    ol.innerHTML = rows.map((m, i) => {
      const meA = m.player_a === uid, o = meA ? m.b : m.a, win = m.winner === uid; if (win) w++;
      const ms = +(meA ? m.score_a : m.score_b), os = +(meA ? m.score_b : m.score_a);
      const d = m.ranked ? (meA ? m.elo_a_after - m.elo_a_before : m.elo_b_after - m.elo_b_before) : null;
      return `<li class="row hrow" style="--i:${i}">
        <span class="res ${win ? 'w' : 'l'}">${win ? 'WIN' : 'LOSS'}</span>${ava(o)}
        <span class="nm"><b>vs ${esc(o?.display_name)}</b><small>${fac(o?.faculty).short}${m.ranked ? '' : ' · тренировка'}</small></span>
        <span class="sc">${ms.toFixed(2)} : ${os.toFixed(2)}</span>
        <span class="dl ${d == null ? '' : d >= 0 ? 'up' : 'down'}">${d == null ? '·' : (d >= 0 ? '+' : '') + d}</span>
        <span class="ago">${timeAgo(m.judged_at)}</span>
      </li>`;
    }).join('');
    $('#hSum').innerHTML = `<span><b>${w}</b> W</span><span><b>${rows.length - w}</b> L</span>`;
  } catch (e) { const ol = $('#hRows'); if (ol) ol.innerHTML = `<li class="empty-state"><b>Не загрузилось</b><span>${esc(e.message)}</span></li>`; }
}

/* =================== profile =================== */
function normTag(t) { return t.replace(/^#+/, '').trim().toLowerCase().replace(/\s+/g, '_').slice(0, 20); }
async function cropAvatar(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
  c.width = c.height = 320;
  c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 320, 320);
  URL.revokeObjectURL(url);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}
function viewProfile() {
  const isNew = !S.profile;
  const p = S.profile || { display_name: '', username: '', faculty: '', bio: '', tags: [], avatar_url: null, elo: 1000, peak_elo: 1000, wins: 0, losses: 0, streak: 0, best_streak: 0 };
  const form = { ...p, tags: [...(p.tags || [])] };
  const t = tierOf(p.elo), got = achSet(p), total = p.wins + p.losses;
  $('#main').innerHTML = `
  <section class="prof view">
    <div class="prof-left">
      <label class="ava-edit" id="avaEdit">
        <span id="avaBox">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : `<span class="ini">${esc(initials(p.display_name || '?'))}</span>`}</span>
        <span class="over"><i data-lucide="image-up"></i>Сменить аву</span>
        <input type="file" accept="image/*" id="avaInput" aria-label="Загрузить аватар">
      </label>
      <div class="prof-id">
        <h2>${isNew ? 'Новый боец' : esc(p.display_name)}</h2>
        <p>${isNew ? 'Заполни профиль, чтобы выйти на арену' : `@${esc(p.username)} · ${fac(p.faculty).name}`}</p>
        <span class="tier-badge">${t.name}</span>
      </div>
      <dl class="statlist">
        <div><dt>ELO</dt><dd>${p.elo}</dd></div><div><dt>Пик</dt><dd>${p.peak_elo}</dd></div>
        <div><dt>Победы</dt><dd>${p.wins}</dd></div><div><dt>Поражения</dt><dd>${p.losses}</dd></div>
        <div><dt>Винрейт</dt><dd>${total ? Math.round(p.wins / total * 100) : 0}%</dd></div><div><dt>Лучшая серия</dt><dd>${p.best_streak}</dd></div>
      </dl>
      <div class="ach-block">
        <div class="ach-title"><span class="eyebrow">Ачивки</span><span class="mono muted" style="font-size:.8rem">${got.size}/${ACH.length}</span></div>
        <ul class="ach" style="margin-top:12px">${ACH.map(a => `<li class="${got.has(a.id) ? 'got' : ''}"><span class="ic"><i data-lucide="${a.ic}"></i></span><span><b>${a.n}</b>${a.d}</span></li>`).join('')}</ul>
      </div>
    </div>
    <form class="prof-form" id="profForm" novalidate>
      <div><p class="eyebrow">${isNew ? 'Шаг 1 из 1' : 'Настройки'}</p><h1 class="h-page">${isNew ? 'Заверши профиль' : 'Профиль'}</h1></div>
      <div class="row2">
        <div class="field"><label for="pName">Имя</label><input class="input" id="pName" maxlength="32" value="${esc(form.display_name)}"></div>
        <div class="field"><label for="pUser">Юзернейм</label><input class="input" id="pUser" maxlength="20" value="${esc(form.username)}"></div>
      </div>
      <div class="field"><label for="pFac">Факультет</label>
        <select class="select" id="pFac"><option value="">Выбери факультет</option>${FACULTIES.map(f => `<option value="${f.id}" ${form.faculty === f.id ? 'selected' : ''}>${f.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label for="pBio">О себе</label><textarea class="input" id="pBio" maxlength="160" placeholder="Пара слов, которые увидит соперник">${esc(form.bio)}</textarea><span class="counter" id="bioCnt">${(form.bio || '').length}/160</span></div>
      <div class="field">
        <span class="lbl">Теги · до 6</span>
        <div class="tag-input" id="tagBox"></div>
        <div class="sugg" id="tagSugg"></div>
      </div>
      <p class="err" id="profErr"></p>
      <div class="form-actions">
        <button class="btn primary" id="saveBtn">${isNew ? 'На арену' : 'Сохранить'}<i data-lucide="${isNew ? 'arrow-right' : 'check'}"></i></button>
        <button class="btn ghost" type="button" id="outBtn"><i data-lucide="log-out"></i>Выйти</button>
      </div>
    </form>
  </section>`;
  icons();

  const renderTags = () => {
    $('#tagBox').innerHTML = form.tags.map((t, i) => `<span class="chip">#${esc(t)}<button type="button" data-rm="${i}" aria-label="Убрать"><i data-lucide="x"></i></button></span>`).join('') +
      (form.tags.length < 6 ? `<input id="tagIn" placeholder="${form.tags.length ? 'ещё тег' : 'например gym, кодинг'}" maxlength="20">` : '');
    $('#tagSugg').innerHTML = form.tags.length < 6 ? TAG_SUGGEST.filter(s => !form.tags.includes(s)).slice(0, 8).map(s => `<button type="button" data-add="${esc(s)}">+ ${esc(s)}</button>`).join('') : '';
    icons();
    const inp = $('#tagIn');
    if (inp) inp.onkeydown = e => {
      if ((e.key === 'Enter' || e.key === ',') && inp.value.trim()) { e.preventDefault(); addTag(inp.value); }
      else if (e.key === 'Backspace' && !inp.value && form.tags.length) { form.tags.pop(); renderTags(); $('#tagIn')?.focus(); }
    };
  };
  const addTag = v => { const t = normTag(v); if (t && !form.tags.includes(t) && form.tags.length < 6) { form.tags.push(t); SFX.click(); } renderTags(); $('#tagIn')?.focus(); };
  $('#tagBox').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { form.tags.splice(+b.dataset.rm, 1); renderTags(); } else $('#tagIn')?.focus(); };
  $('#tagSugg').onclick = e => { const b = e.target.closest('[data-add]'); if (b) addTag(b.dataset.add); };
  renderTags();
  $('#pBio').oninput = e => { $('#bioCnt').textContent = e.target.value.length + '/160'; };

  $('#avaInput').onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    if (!f.type.startsWith('image/')) { toast('Нужна картинка', 'hot'); return; }
    const box = $('#avaEdit'); box.classList.add('busy');
    try {
      const blob = await cropAvatar(f);
      const url = await Net.uploadAvatar(S.user.id, blob);
      form.avatar_url = url;
      $('#avaBox').innerHTML = `<img src="${esc(url)}" alt="">`;
      if (!isNew) { S.profile = await Net.saveProfile(S.user.id, { avatar_url: url }, false); updateMe(); toast('Ава обновлена', '', 'check'); }
    } catch (ex) { toast('Не загрузилось: ' + ex.message, 'hot'); }
    box.classList.remove('busy');
  };
  $('#outBtn').onclick = async () => { await Net.signOut(); location.reload(); };
  $('#profForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#profErr'), btn = $('#saveBtn'); err.textContent = '';
    $$('.input,.select').forEach(i => i.removeAttribute('aria-invalid'));
    const pending = $('#tagIn')?.value.trim(); if (pending) addTag(pending);
    const patch = {
      display_name: $('#pName').value.trim(), username: $('#pUser').value.trim(), faculty: $('#pFac').value,
      bio: $('#pBio').value.trim(), tags: form.tags, avatar_url: form.avatar_url || null,
    };
    const bad = (id, m) => { $(id).setAttribute('aria-invalid', 'true'); err.textContent = m; $(id).focus(); };
    if (patch.display_name.length < 2) return bad('#pName', 'Имя: от 2 символов');
    if (!/^[a-zA-Z0-9_.]{3,20}$/.test(patch.username)) return bad('#pUser', 'Юзернейм: 3-20 символов, латиница, цифры, _ и .');
    if (!patch.faculty) return bad('#pFac', 'Выбери факультет');
    btn.classList.add('is-loading');
    try {
      S.profile = await Net.saveProfile(S.user.id, patch, isNew);
      updateMe(true); toast(isNew ? 'Профиль готов. Погнали' : 'Сохранено', '', 'check');
      if (isNew) { lockNav(false); startLive(); confetti(120, .5, .3); SFX.win(); go('arena'); }
      else { btn.classList.remove('is-loading'); viewProfile(); }
    } catch (ex) { btn.classList.remove('is-loading'); err.textContent = ex.message; }
  };
}

/* =================== boot =================== */
function startLive() {
  if (S.liveStarted) return; S.liveStarted = true;
  Net.lobby(S.user.id, n => { S.online = n; updateOnline(); });
  Net.onFeed(() => loadFeed());
  loadFeed();
  loadLandmarker().catch(() => {});
}
async function boot() {
  const u = await Net.session().catch(() => null);
  if (!u) { renderAuth(); return; }
  S.user = u;
  S.profile = await Net.getProfile(u.id).catch(e => { console.error(e); return null; });
  renderShell();
  if (!S.profile) { lockNav(true); S.view = 'profile'; viewProfile(); return; }
  startLive();
  go('arena');
}

document.addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,select')) return;
  if (!S.profile || S.battle) return;
  const map = { '1': 'arena', '2': 'board', '3': 'history', '4': 'profile' };
  if (map[e.key]) { go(map[e.key]); return; }
  if (S.view === 'arena') {
    if ((e.key === 'Enter' || e.code === 'Space') && !S.search && !e.target.closest?.('button')) { e.preventDefault(); startSearch(); }
    if (e.key === 'Escape' && S.search) cancelSearch();
  }
  if (S.view === 'result' && (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'к')) again();
});
addEventListener('beforeunload', () => {
  try { S.battle?.room?.send('bye', {}); S.battle?.room?.leave(); } catch (e) {}
  if (S.search) {
    S.search.ac.abort();
    if (USE_SB && sb) sb.rpc('cancel_queue').catch(() => {});
  }
});

boot();
</script>
