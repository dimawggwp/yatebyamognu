<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Facematch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap&subset=cyrillic" rel="stylesheet">
<!--
================================================================
 MOGGED · Арена  (один файл, работает на GitHub Pages)

 ПОЧЕМУ РАНЬШЕ НИКТО НЕ ЗАХОДИЛ В МАТЧ:
  - GitHub Pages умеет только статику, main.py (FastAPI + WebSocket) там не запускается.
  - В старом index.html не были вписаны ключи Supabase, поэтому сайт работал в демо-режиме:
    очередь жила в localStorage твоего браузера, и соперник мог найтись только во второй вкладке.
  - Плюс в старой очереди ожидающий игрок больше не искал соперника сам (poll не матчил).

 ЧТО НУЖНО СДЕЛАТЬ ОДИН РАЗ (5 минут, бесплатно):
  1. Создай проект на https://supabase.com  → Project Settings → API:
     скопируй Project URL и anon public key и вставь в CONFIG ниже (SUPABASE_URL, SUPABASE_ANON_KEY).
  2. Supabase → SQL Editor → New query: вставь весь SQL из блока <script id="sql"> ниже и нажми Run.
     (SQL можно запускать повторно, он безопасно обновляет старую схему.)
  3. Supabase → Authentication → URL Configuration:
     Site URL = https://dimawggwp.github.io/yatebyamognu/
     Redirect URLs: добавь тот же адрес. Иначе ссылка из письма не залогинит.
  4. Authentication → Sign In / Providers → Email: включён.
     "Confirm email" можно выключить, тогда регистрация по паролю пускает сразу.
  5. Залей этот файл как index.html в репозиторий. Готово.
  Код из письма (необязательно): Authentication → Emails → Magic Link, добавь в шаблон {{ .Token }}.
  Про почту: встроенная почта Supabase шлёт всего несколько писем в час.
  Для реального запуска подключи SMTP (Authentication → Emails → SMTP), например Resend или Brevo.
================================================================
-->
<style>
:root{
 --bg: oklch(13.5% 0.012 25);
 --s1: oklch(17% 0.014 25);
 --s2: oklch(20.5% 0.016 25);
 --s3: oklch(25% 0.018 25);
 --line: oklch(30% 0.02 25);
 --line-soft: oklch(22.5% 0.016 25);
 --tx: oklch(95.5% 0.008 25);
 --tx2: oklch(76% 0.014 25);
 --tx3: oklch(57% 0.016 25);
 --red: oklch(58% 0.22 27);
 --red-hi: oklch(65% 0.215 27);
 --red-lo: oklch(42% 0.16 27);
 --red-deep: oklch(22% 0.07 27);
 --on-red: oklch(97% 0.012 25);
 --ok: oklch(78% 0.12 150);
 --f-display: 'Unbounded', 'Onest', system-ui, sans-serif;
 --f-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
 --f-mono: 'JetBrains Mono', ui-monospace, monospace;
 --sp-2xs: 4px; --sp-xs: 8px; --sp-sm: 12px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-2xl: 48px; --sp-3xl: 72px; --sp-4xl: 96px;
 --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
 --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
 --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
 --z-sticky: 20; --z-nav: 30; --z-toast: 60;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased;color-scheme:dark}
body{min-height:100dvh;line-height:1.6;letter-spacing:.012em;overflow-x:hidden}
h1,h2,h3{text-wrap:balance;font-weight:700}
p{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}
::selection{background:var(--red);color:var(--on-red)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--tx3)}
.ic{width:18px;height:18px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:var(--z-nav);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--sp-xl);height:68px;padding:0 var(--sp-xl);background:var(--bg);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:900;font-size:1.15rem;letter-spacing:.02em}
.brand-mark{width:12px;height:12px;background:var(--red);align-self:center;transform:rotate(45deg);animation:markSpin 8s var(--ease-io) infinite}
@keyframes markSpin{0%,80%{transform:rotate(45deg)}100%{transform:rotate(225deg)}}
.brand-sub{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--tx3)}
.nav{display:flex;gap:var(--sp-xl);justify-self:center}
.nav a{position:relative;padding:22px 0;color:var(--tx3);font-weight:500;cursor:pointer;transition:color .2s var(--ease-out);display:flex;align-items:center;gap:8px}
.nav a:hover,.nav a.on{color:var(--tx)}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.nav a.on::after{transform:scaleX(1)}
.nav a .ic{display:none}
.nav-locked .nav a{pointer-events:none;opacity:.3}
.top-r{display:flex;align-items:center;gap:var(--sp-sm)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-soft);color:var(--tx2);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--tx);border-color:var(--line)}
.lang{height:40px;padding:0 10px;border:1px solid var(--line-soft);font-family:var(--f-mono);font-size:.75rem;color:var(--tx2);display:flex;gap:6px;align-items:center}
.lang span{opacity:.45}.lang span.on{opacity:1;color:var(--tx)}
.lang:hover{border-color:var(--line)}
.me-chip{display:flex;align-items:center;gap:var(--sp-sm);cursor:pointer;padding:6px 6px 6px 14px;border:1px solid var(--line-soft);transition:border-color .2s}
.me-chip:hover{border-color:var(--line)}
.me-chip .elo{font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.me-chip .tier{font-size:.72rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.ava{width:36px;height:36px;background:var(--s3);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.72rem;overflow:hidden;flex:none;color:var(--tx2)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:56px;height:56px;font-size:1rem}
.ava.xl{width:96px;height:96px;font-size:1.6rem}

main{max-width:1340px;margin:0 auto;padding:var(--sp-2xl) var(--sp-xl) var(--sp-4xl)}
.view{animation:viewIn .6s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;font-weight:600;border:1px solid var(--line);transition:background .2s var(--ease-out),border-color .2s,color .2s,transform .12s;white-space:nowrap;position:relative;overflow:hidden}
.btn:hover{border-color:var(--tx3)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,oklch(90% 0.06 27 / .35),transparent);transform:skewX(-20deg);transition:left .7s var(--ease-out)}
.btn.primary:hover::after{left:130%}
.btn.ghost{border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem}
.btn.is-loading{pointer-events:none;color:transparent}
.btn.is-loading::before{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--on-red);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line-soft);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:8px 14px;font-size:.875rem;font-weight:500;color:var(--tx3);transition:color .2s,background .25s var(--ease-out);min-height:36px}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;color:var(--tx3);font-weight:500}
.input,.select{height:48px;padding:0 14px;background:var(--s1);border:1px solid var(--line-soft);transition:border-color .2s,background .2s;width:100%;border-radius:0;appearance:none}
textarea.input{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.input::placeholder{color:var(--tx3)}
.input:hover,.select:hover{border-color:var(--line)}
.input:focus,.select:focus{outline:none;border-color:var(--red);background:var(--s2)}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.select option{background:var(--s1)}
.err{color:var(--red-hi);font-size:.85rem;min-height:1.2em}
.okmsg{color:var(--ok);font-size:.9rem;line-height:1.5}
.hint{font-size:.75rem;color:var(--tx3)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);font-weight:600}
.h-page{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.02;letter-spacing:-.01em}
.h-sec{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}

/* auth */
.auth{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-poster{background:var(--red);color:var(--on-red);padding:var(--sp-2xl) var(--sp-3xl);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-poster .brand-mark{background:var(--on-red)}
.auth-poster .brand-sub{color:oklch(88% 0.05 27)}
.poster-title{font-family:var(--f-display);font-weight:900;font-size:clamp(3.4rem,8.5vw,8.5rem);line-height:.9;letter-spacing:-.02em;margin:var(--sp-2xl) 0}
.poster-title span{display:block;animation:lineUp .9s var(--ease-out) both}
.poster-title span:nth-child(2){animation-delay:.08s}
.poster-title span:nth-child(3){animation-delay:.16s}
@keyframes lineUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.poster-title .outline{color:transparent;-webkit-text-stroke:2px var(--on-red)}
.poster-rules{display:grid;grid-template-columns:repeat(3,auto);gap:var(--sp-xl);justify-content:start;border-top:1px solid oklch(72% 0.13 27);padding-top:var(--sp-lg)}
.poster-rules b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:600;line-height:1.2}
.poster-rules span{font-size:.85rem;color:oklch(90% 0.04 27)}
.poster-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(oklch(64% 0.2 27) 1px,transparent 1px),linear-gradient(90deg,oklch(64% 0.2 27) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(120deg,transparent 30%,black 100%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,black 100%);animation:gridDrift 18s linear infinite}
@keyframes gridDrift{to{background-position:64px 64px,64px 64px}}
.poster-rules,.poster-title,.auth-poster .brand{position:relative}
.auth-form-wrap{display:grid;place-items:center;padding:var(--sp-2xl) var(--sp-xl);position:relative}
.auth-lang{position:absolute;top:var(--sp-lg);right:var(--sp-lg)}
.auth-form{width:100%;max-width:420px;display:grid;gap:var(--sp-md)}
.auth-form h1{font-family:var(--f-display);font-size:1.8rem;font-weight:800;margin-bottom:var(--sp-2xs)}
.auth-form .lead{color:var(--tx2);margin-bottom:var(--sp-sm)}
.auth-tabs{margin-bottom:var(--sp-md)}
.auth-form .btn{width:100%;margin-top:var(--sp-xs)}
.auth-note{font-size:.8rem;color:var(--tx3)}
.linkish{color:var(--tx2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkish:hover{color:var(--tx)}
.divider{display:flex;align-items:center;gap:var(--sp-sm);color:var(--tx3);font-size:.8rem;margin-top:var(--sp-xs)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.code-row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-xs)}
.code-row .btn{width:auto;margin:0}

/* setup */
.setup-steps{counter-reset:s;display:grid;gap:var(--sp-md);list-style:none}
.setup-steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:var(--sp-sm);color:var(--tx2);font-size:.92rem}
.setup-steps li::before{content:counter(s);font-family:var(--f-mono);color:var(--red-hi);font-weight:600}
.setup-steps code,.inline-code{font-family:var(--f-mono);font-size:.8rem;background:var(--s2);padding:1px 6px;color:var(--tx)}

/* arena */
.arena{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--sp-3xl);align-items:start}
.arena-head{margin-bottom:var(--sp-xl);display:grid;gap:var(--sp-sm)}
.cam{position:relative;aspect-ratio:4/3;background:var(--s1);border:1px solid var(--line-soft);overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:var(--sp-md);padding:var(--sp-xl);color:var(--tx3)}
.cam-empty .ic{width:36px;height:36px;color:var(--tx2)}
.corners::before,.corners::after{content:"";position:absolute;width:28px;height:28px;border:2px solid var(--red);pointer-events:none;z-index:2}
.corners::before{top:14px;left:14px;border-right:0;border-bottom:0}
.corners::after{bottom:14px;right:14px;border-left:0;border-top:0}
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-sm) var(--sp-lg);align-items:center;margin-top:var(--sp-lg)}
.go-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-lg);margin-top:var(--sp-xl)}
.go-btn{min-height:64px;padding:0 40px;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:1rem}
.searching{display:flex;align-items:center;gap:var(--sp-md)}
.pulse{width:12px;height:12px;background:var(--red);position:relative}
.pulse::after{content:"";position:absolute;inset:0;border:1px solid var(--red-hi);animation:ping 1.4s var(--ease-out) infinite}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
.searching b{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.side{display:grid;gap:var(--sp-2xl)}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-soft)}
.stat{padding:var(--sp-md) 0;border-bottom:1px solid var(--line-soft);display:grid;gap:2px}
.stat:nth-child(odd){padding-right:var(--sp-md)}
.stat b{font-family:var(--f-mono);font-size:1.7rem;font-weight:600;line-height:1.2}
.stat span{font-size:.78rem;color:var(--tx3)}
.stat.big{grid-column:1/-1}
.stat.big b{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--tx)}
.feed{list-style:none;display:grid}
.feed li{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-sm);align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.88rem}
.feed li .r{text-align:right}
.feed .w{color:var(--tx);font-weight:600}
.feed .l{color:var(--tx3)}
.feed .sc{font-family:var(--f-mono);font-size:.8rem;color:var(--tx2)}
.steps3{display:grid;gap:var(--sp-sm);counter-reset:k;list-style:none}
.steps3 li{counter-increment:k;display:grid;grid-template-columns:28px 1fr;color:var(--tx2);font-size:.9rem}
.steps3 li::before{content:"0" counter(k);font-family:var(--f-mono);font-size:.75rem;color:var(--red-hi);padding-top:3px}
.empty{color:var(--tx3);font-size:.9rem;padding:var(--sp-lg) 0}

/* match */
.m-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-md);margin-bottom:var(--sp-lg)}
.m-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-lg);align-items:center}
.pane{position:relative;aspect-ratio:3/4;background:var(--s1);border:1px solid var(--line-soft);overflow:hidden}
.pane video,.pane img.relay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pane.me video{transform:scaleX(-1)}
.pane .who{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-md);display:flex;align-items:end;justify-content:space-between;gap:var(--sp-sm);background:linear-gradient(to top,oklch(10% 0.01 25 / .85),transparent);z-index:3}
.who .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.who .el{font-family:var(--f-mono);font-size:.8rem;color:var(--tx2)}
.who .score{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.pane .wait{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:var(--sp-sm);color:var(--tx3);text-align:center;padding:var(--sp-lg);z-index:1}
.pane .badge{position:absolute;top:var(--sp-sm);left:var(--sp-sm);z-index:3;font-size:.7rem;font-family:var(--f-mono);padding:2px 8px;background:var(--bg);border:1px solid var(--line-soft);color:var(--tx3)}
.pane.scanning::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,transparent 49.6%,var(--red-hi) 50%,transparent 50.4%);animation:scan 1.3s var(--ease-io) infinite alternate;pointer-events:none}
@keyframes scan{from{transform:translateY(-44%)}to{transform:translateY(44%)}}
.vs{display:grid;justify-items:center;gap:var(--sp-sm);min-width:120px;text-align:center}
.m-big{font-family:var(--f-display);font-weight:900;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;color:var(--red)}
.m-big.pop{animation:pop .7s var(--ease-out)}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
.m-status{font-size:.85rem;color:var(--tx2);max-width:18ch}
.result{margin-top:var(--sp-2xl);display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-2xl);align-items:center;padding-top:var(--sp-xl);border-top:1px solid var(--line-soft);animation:viewIn .6s var(--ease-out) both}
.result .word{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,5vw,4rem);line-height:.95}
.result .word.win{color:var(--red-hi)}
.result .delta{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.bars{display:grid;gap:10px;max-width:520px}
.barrow{display:grid;grid-template-columns:130px 1fr 44px;gap:var(--sp-sm);align-items:center;font-size:.82rem;color:var(--tx2)}
.bar{height:6px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transform-origin:left;transform:scaleX(var(--v,0));transition:transform 1s var(--ease-out)}
.barrow .mono{text-align:right;color:var(--tx)}
.res-actions{display:grid;gap:var(--sp-sm)}

/* tables */
.tbl{width:100%;border-collapse:collapse;margin-top:var(--sp-xl)}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:600;text-align:left;padding:0 var(--sp-sm) var(--sp-sm);border-bottom:1px solid var(--line)}
.tbl td{padding:12px var(--sp-sm);border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.n{font-family:var(--f-mono);color:var(--tx3);width:56px}
.tbl tr.top3 td.n{color:var(--red-hi);font-weight:600}
.tbl tr.mine td{background:var(--red-deep)}
.tbl .pl{display:flex;align-items:center;gap:var(--sp-sm)}
.tbl .pl small{display:block;color:var(--tx3);font-size:.75rem}
.tbl .num{font-family:var(--f-mono);text-align:right}
.tbl th.num{text-align:right}
.res-w{color:var(--ok);font-weight:600}
.res-l{color:var(--red-hi);font-weight:600}

/* profile */
.prof{display:grid;grid-template-columns:auto minmax(0,520px);gap:var(--sp-3xl);margin-top:var(--sp-xl);align-items:start}
.prof-ava{display:grid;gap:var(--sp-sm);justify-items:start}
.prof-form{display:grid;gap:var(--sp-md)}

.toast{background:var(--s2);border:1px solid var(--line);padding:12px 16px;font-size:.88rem;animation:viewIn .4s var(--ease-out) both}
.toast.bad{border-color:var(--red)}

 .arena,.prof{grid-template-columns:1fr;gap:var(--sp-2xl)}
 .result{grid-template-columns:1fr;gap:var(--sp-lg)}
}
@media (max-width: 760px){
 .top{grid-template-columns:auto auto;justify-content:space-between;padding:0 var(--sp-md);gap:var(--sp-sm)}
 .brand-sub,.me-chip .tier{display:none}
 .nav{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line-soft);gap:0;padding-bottom:env(safe-area-inset-bottom)}
 .nav a{flex-direction:column;gap:2px;padding:10px 6px;font-size:.7rem}
 .nav a .ic{display:block;width:20px;height:20px}
 .nav a::after{top:-1px;bottom:auto}
 main{padding:var(--sp-lg) var(--sp-md) 120px}
 .m-stage{grid-template-columns:1fr 1fr;gap:var(--sp-sm)}
 .vs{grid-column:1/-1;grid-row:1;min-width:0}

 .tbl .hide-sm{display:none}
 .row2{grid-template-columns:1fr}

}

<script type="text/plain" id="sql">
-- MOGGED · схема для Supabase. Можно запускать повторно.
create extension if not exists pgcrypto;

-- ---------- профили (регистрация сохраняется тут) ----------
create table if not exists public.profiles (
  id uuid primary key references auth.users on delete cascade,
  username text not null,
  display_name text not null,
  faculty text not null default 'digital',
  bio text not null default '',
  tags text[] not null default '{}',
  avatar_url text,
  elo int not null default 1000,
  peak_elo int not null default 1000,
  wins int not null default 0,
  losses int not null default 0,
  streak int not null default 0,
  best_streak int not null default 0,
  created_at timestamptz not null default now()
);
-- снимаем старые строгие ограничения на ник (латиница, спецсимволы и т.д.)
alter table public.profiles drop constraint if exists profiles_username_check;
alter table public.profiles drop constraint if exists profiles_display_name_check;
alter table public.profiles drop constraint if exists profiles_faculty_check;
alter table public.profiles drop constraint if exists profiles_username_key;
alter table public.profiles add constraint profiles_username_check check (char_length(btrim(username)) between 2 and 24);
alter table public.profiles add constraint profiles_display_name_check check (char_length(btrim(display_name)) between 2 and 24);
alter table public.profiles alter column faculty set default 'digital';
create unique index if not exists profiles_username_lower_idx on public.profiles (lower(username));
create index if not exists profiles_elo_idx on public.profiles (elo desc);

-- ---------- очередь ----------
create table if not exists public.queue (
  user_id uuid primary key references public.profiles on delete cascade,
  elo int not null,
  faculty text not null,
  scope text not null default 'all',
  ranked boolean not null default true,
  match_id uuid,
  created_at timestamptz not null default now()
);
alter table public.queue add column if not exists last_seen timestamptz not null default now();

-- ---------- матчи (история игр и ELO) ----------
create table if not exists public.matches (
  id uuid primary key default gen_random_uuid(),
  player_a uuid not null references public.profiles on delete cascade,
  player_b uuid not null references public.profiles on delete cascade,
  ranked boolean not null default true,
  status text not null default 'pending',
  report_a jsonb, report_b jsonb,
  score_a numeric, score_b numeric, winner uuid,
  elo_a_before int, elo_b_before int, elo_a_after int, elo_b_after int,
  created_at timestamptz not null default now(),
  judged_at timestamptz
);
create index if not exists matches_judged_idx on public.matches (judged_at desc);
create index if not exists matches_a_idx on public.matches (player_a, judged_at desc);
create index if not exists matches_b_idx on public.matches (player_b, judged_at desc);

-- ---------- доступ ----------
alter table public.profiles enable row level security;
alter table public.queue enable row level security;
alter table public.matches enable row level security;

drop policy if exists "profiles_read" on public.profiles;
drop policy if exists "profiles_insert_own" on public.profiles;
drop policy if exists "profiles_update_own" on public.profiles;
create policy "profiles_read" on public.profiles for select using (true);
create policy "profiles_insert_own" on public.profiles for insert to authenticated with check (auth.uid() = id);
create policy "profiles_update_own" on public.profiles for update to authenticated using (auth.uid() = id);
revoke insert, update on public.profiles from anon, authenticated;
grant insert (id, username, display_name, faculty, bio, tags, avatar_url) on public.profiles to authenticated;
grant update (username, display_name, faculty, bio, tags, avatar_url) on public.profiles to authenticated;

drop policy if exists "matches_read" on public.matches;
create policy "matches_read" on public.matches for select using (true);

-- старые функции больше не нужны
drop function if exists public.find_match(text, boolean);
drop function if exists public.poll_match();
drop function if exists public.report_result(uuid, numeric, numeric, jsonb);

-- ---------- матчмейкинг: каждый тик сам ищет соперника ----------
create or replace function public.mm_tick(p_scope text default 'all', p_ranked boolean default true)
returns uuid language plpgsql security definer set search_path = public as $$
declare me profiles; mine queue; other queue; mid uuid; waited int;
begin
  select * into me from profiles where id = auth.uid();
  if not found then raise exception 'no profile'; end if;

  select * into mine from queue where user_id = me.id for update;
  if found and mine.match_id is not null then
    delete from queue where user_id = me.id;
    return mine.match_id;
  end if;

  delete from queue
   where (match_id is null and last_seen < now() - interval '12 seconds')
      or last_seen < now() - interval '60 seconds';

  waited := coalesce(extract(epoch from now() - mine.created_at)::int, 0);

  select q.* into other from queue q
   where q.match_id is null and q.user_id <> me.id and q.ranked = p_ranked
     and abs(q.elo - me.elo) <= 150 + 25 * greatest(waited, extract(epoch from now() - q.created_at)::int)
     and ((p_scope <> 'faculty' and q.scope <> 'faculty') or q.faculty = me.faculty)
   order by abs(q.elo - me.elo), q.created_at
   limit 1 for update of q skip locked;

  if other.user_id is null then
    insert into queue(user_id, elo, faculty, scope, ranked, created_at, last_seen)
    values (me.id, me.elo, me.faculty, p_scope, p_ranked, now(), now())
    on conflict (user_id) do update
      set last_seen = now(), elo = excluded.elo, faculty = excluded.faculty,
          scope = excluded.scope, ranked = excluded.ranked;
    return null;
  end if;

  insert into matches(player_a, player_b, ranked, elo_a_before, elo_b_before)
  values (other.user_id, me.id, p_ranked, other.elo, me.elo) returning id into mid;
  update queue set match_id = mid, last_seen = now() where user_id = other.user_id;
  delete from queue where user_id = me.id;
  return mid;
end $$;

create or replace function public.cancel_queue()
returns void language sql security definer set search_path = public as $$
  delete from queue where user_id = auth.uid();
$$;

create or replace function public.cancel_match(p_match uuid)
returns void language sql security definer set search_path = public as $$
  update matches set status = 'cancelled'
   where id = p_match and status = 'pending' and auth.uid() in (player_a, player_b);
$$;

-- ---------- судейство и ELO ----------
create or replace function public._avg2(x numeric, y numeric)
returns numeric language sql immutable as $$
  select round(case
    when coalesce(x,-1) >= 0 and coalesce(y,-1) >= 0 then (x + y) / 2
    when coalesce(x,-1) >= 0 then x
    when coalesce(y,-1) >= 0 then y
    else 5 end, 2)
$$;

create or replace function public._finalize(p_match uuid, p_winner uuid, p_sa numeric, p_sb numeric)
returns void language plpgsql security definer set search_path = public as $$
declare m matches; l uuid; ew int; el int; ea float8; d int;
begin
  select * into m from matches where id = p_match;
  if not found or m.status <> 'pending' then return; end if;
  l := case when p_winner = m.player_a then m.player_b else m.player_a end;
  if m.ranked then
    select elo into ew from profiles where id = p_winner;
    select elo into el from profiles where id = l;
    ea := 1 / (1 + power(10, (el - ew) / 400.0));
    d := greatest(8, round(32 * (1 - ea)))::int;
    update profiles set elo = elo + d, wins = wins + 1, streak = streak + 1,
      best_streak = greatest(best_streak, streak + 1), peak_elo = greatest(peak_elo, elo + d)
     where id = p_winner;
    update profiles set elo = greatest(100, elo - d), losses = losses + 1, streak = 0 where id = l;
  end if;
  update matches set status = 'judged', score_a = p_sa, score_b = p_sb, winner = p_winner, judged_at = now(),
    elo_a_after = (select elo from profiles where id = m.player_a),
    elo_b_after = (select elo from profiles where id = m.player_b)
   where id = p_match;
end $$;

create or replace function public.report_result(p_match uuid, p_self numeric, p_opp numeric, p_breakdown jsonb)
returns void language plpgsql security definer set search_path = public as $$
declare m matches; rep jsonb; sa numeric; sb numeric;
begin
  select * into m from matches where id = p_match for update;
  if not found or m.status <> 'pending' then return; end if;
  rep := jsonb_build_object(
    'self', least(10, greatest(-1, coalesce(p_self, -1))),
    'opp',  least(10, greatest(-1, coalesce(p_opp, -1))),
    'b', coalesce(p_breakdown, '{}'::jsonb), 'at', now());
  if auth.uid() = m.player_a then
    update matches set report_a = rep where id = p_match; m.report_a := rep;
  elsif auth.uid() = m.player_b then
    update matches set report_b = rep where id = p_match; m.report_b := rep;
  else raise exception 'not a player'; end if;
  if m.report_a is null or m.report_b is null then return; end if;
  sa := _avg2((m.report_a->>'self')::numeric, (m.report_b->>'opp')::numeric);
  sb := _avg2((m.report_b->>'self')::numeric, (m.report_a->>'opp')::numeric);
  perform _finalize(p_match, case when sa >= sb then m.player_a else m.player_b end, sa, sb);
end $$;

-- соперник пропал после боя: через 30 с победа засчитывается оставшемуся
create or replace function public.claim_forfeit(p_match uuid)
returns boolean language plpgsql security definer set search_path = public as $$
declare m matches; mine jsonb; theirs jsonb; s numeric;
begin
  select * into m from matches where id = p_match for update;
  if not found or m.status <> 'pending' then return false; end if;
  if auth.uid() = m.player_a then mine := m.report_a; theirs := m.report_b;
  elsif auth.uid() = m.player_b then mine := m.report_b; theirs := m.report_a;
  else return false; end if;
  if mine is null or theirs is not null then return false; end if;
  if (mine->>'at')::timestamptz > now() - interval '30 seconds' then return false; end if;
  s := greatest(0, (mine->>'self')::numeric);
  if auth.uid() = m.player_a then perform _finalize(p_match, m.player_a, s, 0);
  else perform _finalize(p_match, m.player_b, 0, s); end if;
  return true;
end $$;

revoke all on function public._finalize(uuid, uuid, numeric, numeric) from public, anon, authenticated;
revoke all on function public.mm_tick(text, boolean), public.cancel_queue(), public.cancel_match(uuid),
  public.report_result(uuid, numeric, numeric, jsonb), public.claim_forfeit(uuid) from public, anon;
grant execute on function public.mm_tick(text, boolean), public.cancel_queue(), public.cancel_match(uuid),
  public.report_result(uuid, numeric, numeric, jsonb), public.claim_forfeit(uuid) to authenticated;

-- ---------- аватарки ----------
insert into storage.buckets (id, name, public) values ('avatars', 'avatars', true) on conflict (id) do nothing;
drop policy if exists "avatars_read" on storage.objects;
drop policy if exists "avatars_insert_own" on storage.objects;
drop policy if exists "avatars_update_own" on storage.objects;
create policy "avatars_read" on storage.objects for select using (bucket_id = 'avatars');
create policy "avatars_insert_own" on storage.objects for insert to authenticated
  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "avatars_update_own" on storage.objects for update to authenticated
  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);
</script>

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let LANG = LS.get('mog_lang', (navigator.language||'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en');
function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) ?? I18N.ru[k] ?? k;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, n) => vars[n] ?? '');
  return s;
}
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp01 = v => Math.max(0, Math.min(1, v));
const here = () => location.origin + location.pathname;
function tierOf(elo){ return elo < 900 ? 0 : elo < 1100 ? 1 : elo < 1300 ? 2 : elo < 1500 ? 3 : 4; }
function initials(n){ return esc(String(n||'?').trim().split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase()); }
function ava(p, cls){ return `<span class="ava ${cls||''}">${p && p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : initials(p && p.display_name)}</span>`; }
function ago(ts){
  const s = (Date.now() - new Date(ts).getTime())/1000;
  if (s < 60) return t('ago_now');
  if (s < 3600) return t('ago_m', {n: Math.floor(s/60)});
  if (s < 86400) return t('ago_h', {n: Math.floor(s/3600)});
  return t('ago_d', {n: Math.floor(s/86400)});
}
function cleanNick(v){ return String(v||'').replace(/\s+/g,' ').trim(); }
function toast(msg, bad){
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4800);
}
function busy(btn, on){ if (!btn) return; btn.classList.toggle('is-loading', !!on); btn.disabled = !!on; }
function authErr(e){
  const m = String((e && (e.message || e.error_description)) || e || '');
  if (/invalid login/i.test(m)) return t('err_creds');
  if (/already registered|already exists/i.test(m)) return t('err_exists');
  if (/not confirmed/i.test(m)) return t('err_unconf');
  if (/rate limit|too many|security purposes/i.test(m)) return t('err_rate');
  if (/password/i.test(m)) return t('err_pass');
  if (/invalid.*email|email.*invalid/i.test(m)) return t('err_email');
  if (/token|otp|expired/i.test(m)) return t('err_code');
  if (/could not find the function|does not exist|schema cache|no profile/i.test(m)) return t('err_sql');
  return m || t('err_net');
}

async function boot(){
  document.documentElement.lang = LANG;
  const cfg = getCfg();
  if (!cfg.url || !cfg.key || !window.supabase){ renderSetup(); return; }
  S.sb = window.supabase.createClient(cfg.url, cfg.key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'mogged-auth' },
    realtime: { params: { eventsPerSecond: 20 } }
  });
  S.sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => onSession(session, ev), 0); });
  const { data } = await S.sb.auth.getSession();
  onSession(data.session, 'BOOT');
}

async function onSession(session, ev){
  const u = session && session.user;
  if (!u){
    if (S.user || ev === 'BOOT' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION'){
      S.user = null; S.me = null; cleanupAll(); renderAuth();
    }
    return;
  }
  if (S.user && S.user.id === u.id && S.me) return;
  if (S.loadingUser === u.id) return;
  S.loadingUser = u.id;
  S.user = u;
  try{
    // убираем токены из адреса после входа по ссылке
    if (location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, '', here());
    let me = await fetchMe();
    if (!me){
      const md = u.user_metadata || {};
      const nick = cleanNick(md.nickname);
      if (nick.length >= 2){
        const r = await createProfile(nick, md.faculty || 'digital');
        if (r.ok) me = r.me;
      }
    }
    S.me = me || null;
    if (!S.me){ renderOnboard(); return; }
    S.view = 'arena';
    renderShell();
    loadFL();
  } catch(e){
    toast(authErr(e), true);
    renderAuth();
  } finally { S.loadingUser = null; }
}
async function fetchMe(){
  const { data, error } = await S.sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (error) throw error;
  return data;
}
async function createProfile(nick, faculty){
  const { data, error } = await S.sb.from('profiles').insert({
    id: S.user.id, username: nick, display_name: nick, faculty: FACS.includes(faculty) ? faculty : 'digital'
  }).select('*').single();
  if (error) return { ok: false, err: error.code === '23505' ? t('err_nick_taken') : authErr(error) };
  return { ok: true, me: data };
}
async function nickTaken(nick, exceptId){
  const { data } = await S.sb.from('profiles').select('id').ilike('username', nick.replace(/[\\%_]/g, m => '\\' + m)).limit(1);
  return !!(data && data.length && data[0].id !== exceptId);
}

      ${form}

    </form></div></div>`;
  $$('[data-tab]').forEach(b => b.onclick = e => { e.preventDefault(); S.authTab = b.dataset.tab; S.authMsg = ''; renderAuth(); });

function setErr(m){ const el = $('#aerr'); if (el) el.textContent = m || ''; }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

async function submitAuth(btn){
  setErr('');
  const email = ($('#ae') ? $('#ae').value : '').trim().toLowerCase();
  if (!validEmail(email)) return setErr(t('err_email'));
  LS.set('mog_last_email', email);
  busy(btn, true);
  try{
    if (S.authTab === 'login'){
      const pass = $('#ap').value;
      if (pass.length < 6) return setErr(t('err_pass'));
      const { error } = await S.sb.auth.signInWithPassword({ email, password: pass });
      if (error) return setErr(authErr(error));
    } else if (S.authTab === 'reg'){
      const nick = cleanNick($('#an').value), pass = $('#ap').value, fac = $('#af').value;
      if (nick.length < 2 || nick.length > 24) return setErr(t('err_nick'));
      if (pass.length < 6) return setErr(t('err_pass'));
      if (await nickTaken(nick)) return setErr(t('err_nick_taken'));
      const { data, error } = await S.sb.auth.signUp({ email, password: pass,
        options: { data: { nickname: nick, faculty: fac }, emailRedirectTo: here() } });
      if (error) return setErr(authErr(error));
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return setErr(t('err_exists'));
      if (!data.session){ S.authMsg = t('reg_sent', {email}); S.authTab = 'link'; renderAuth(); }
    } else {
      const { error } = await S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: here(), shouldCreateUser: true } });
      if (error) return setErr(authErr(error));
      S.authMsg = t('link_sent', {email}); renderAuth();
    }
  } catch(e){ setErr(authErr(e)); }
  finally { busy(btn, false); }
}
async function verifyCode(btn){
  setErr('');
  const email = ($('#ae').value || LS.get('mog_last_email','')).trim().toLowerCase();
  const token = $('#acode').value.replace(/\s/g,'');
  if (!validEmail(email)) return setErr(t('err_email'));
  if (token.length < 6) return setErr(t('err_code'));
  busy(btn, true);
  try{
    let r = await S.sb.auth.verifyOtp({ email, token, type: 'email' });
    if (r.error) r = await S.sb.auth.verifyOtp({ email, token, type: 'signup' });
    if (r.error) setErr(t('err_code'));
  } finally { busy(btn, false); }
}

}

async function ensureCam(){
  if (S.stream && S.stream.getVideoTracks().some(tr => tr.readyState === 'live')) return true;
  try{
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { width: {ideal: 640}, height: {ideal: 480}, facingMode: 'user' }, audio: false });
    return true;
  } catch(e){ toast(t('cam_denied'), true); return false; }
}
function attach(video, stream){ if (!video) return; if (video.srcObject !== stream) video.srcObject = stream; video.play && video.play().catch(() => {}); }

async function mmTick(){
  const mm = S.mm;
  if (!mm || mm.busy) return;
  mm.busy = true;
  try{
    const { data, error } = await S.sb.rpc('mm_tick', { p_scope: mm.scope, p_ranked: mm.ranked });

/* =================== СКАН ЛИЦА (MediaPipe в браузере, порт ai_engine.py) =================== */
let FL = null, FLp = null;
function loadFL(){
  if (FL) return Promise.resolve(FL);
  if (FLp) return FLp;
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + CONFIG.MP_VER;
  FLp = (async () => {
    const v = await import(base + '/vision_bundle.mjs');
    const fs = await v.FilesetResolver.forVisionTasks(base + '/wasm');
    const opts = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: d }, runningMode: 'IMAGE', numFaces: 1 });
    try { FL = await v.FaceLandmarker.createFromOptions(fs, opts('GPU')); }
    catch(e){ FL = await v.FaceLandmarker.createFromOptions(fs, opts('CPU')); }
    return FL;
  })().catch(e => { console.warn('face model', e); FLp = null; return null; });
  return FLp;
}
const CAN = document.createElement('canvas');
const CTX = CAN.getContext('2d', { willReadFrequently: true });
function analyzeEl(fl, el){
  if (!el) return null;
  const w0 = el.videoWidth || el.naturalWidth, h0 = el.videoHeight || el.naturalHeight;
  if (!w0 || !h0) return null;
  const w = 320, h = Math.round(320 * h0 / w0);
  CAN.width = w; CAN.height = h;
  try { CTX.drawImage(el, 0, 0, w, h); } catch(e){ return null; }
  let res; try { res = fl.detect(CAN); } catch(e){ return null; }
  const lm = res && res.faceLandmarks && res.faceLandmarks[0];
  return lm ? scoreFace(lm, w, h) : null;
}
function scoreFace(lm, w, h){
  const P = i => ({ x: lm[i].x * w, y: lm[i].y * h });
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const faceW = d(P(234), P(454));
  if (faceW < 20) return null;
  // лицо повёрнуто слишком сильно: кадр не считаем
  const nose = P(1);
  if (Math.abs(d(nose, P(234)) - d(nose, P(454))) / faceW > 0.28) return null;
  // 1) кантальный наклон (как в ai_engine.py: 133→33 и 362→263)
  const tilt = (inner, outer) => { const a = P(inner), b = P(outer); return Math.atan2(a.y - b.y, Math.abs(b.x - a.x)) * 180 / Math.PI; };
  const tiltDeg = (tilt(133, 33) + tilt(362, 263)) / 2;
  const sTilt = clamp01((tiltDeg + 4) / 12);
  // 2) симметрия относительно средней линии лба и подбородка
  const top = P(10), chin = P(152);
  const L = Math.hypot(chin.x - top.x, chin.y - top.y) || 1;
  const dist = p => Math.abs((chin.x - top.x) * (top.y - p.y) - (top.x - p.x) * (chin.y - top.y)) / L;
  const pairs = [[33,263],[133,362],[61,291],[132,361],[234,454],[70,300],[172,397]];
  let asym = 0;
  pairs.forEach(([l, r]) => { const dl = dist(P(l)), dr = dist(P(r)); asym += Math.abs(dl - dr) / ((dl + dr) || 1); });
  asym /= pairs.length;
  const sSym = clamp01(1 - asym * 6);
  // 3) челюсть: ширина нижней челюсти к ширине лица
  const jawR = d(P(172), P(397)) / faceW;
  const sJaw = clamp01((jawR - 0.66) / 0.22);
  // 4) трети лица: середина (межбровье → под носом) и низ (под носом → подбородок)
  const mid = d(P(9), P(2)), low = d(P(2), P(152));
  const sThirds = clamp01(1 - Math.abs(low / (mid || 1) - 1.05) * 2.2);
  // 5) межглазное расстояние к ширине глаза (идеал около 1)
  const eyeW = (d(P(33), P(133)) + d(P(362), P(263))) / 2;
  const sEyes = clamp01(1 - Math.abs(d(P(133), P(362)) / (eyeW || 1) - 1) * 1.8);
  const total = 10 * (0.28 * sTilt + 0.26 * sSym + 0.2 * sJaw + 0.14 * sThirds + 0.12 * sEyes);
  return { score: Math.max(1, total), b: { tilt: sTilt * 10, sym: sSym * 10, jaw: sJaw * 10, thirds: sThirds * 10, eyes: sEyes * 10 } };
}
function agg(arr){
  if (!arr || !arr.length) return null;
  const r2 = v => Math.round(v * 100) / 100;
  const s = arr.slice().sort((a, b) => a.score - b.score);
  const cut = s.length >= 6 ? Math.floor(s.length * 0.15) : 0;
  const use = s.slice(cut, s.length - cut);
  const avg = k => r2(use.reduce((a, x) => a + (k ? x.b[k] : x.score), 0) / use.length);
  return { score: avg(null), b: { tilt: avg('tilt'), sym: avg('sym'), jaw: avg('jaw'), thirds: avg('thirds'), eyes: avg('eyes') } };
}

/* =================== МАТЧ: онлайн-соединение =================== */
function send(M, event, payload){
  if (!M || !M.ch) return;
  try { M.ch.send({ type: 'broadcast', event, payload }); } catch(e){}
}
function setStatus(M, s){ M.status = s; const el = $('#mStatus'); if (el) el.textContent = s; }
function setBig(M, s, pop){
  M.big = s; const el = $('#mBig'); if (!el) return;
  el.textContent = s;
  if (pop){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

async function enterMatch(mid){
  const { data: m, error } = await S.sb.from('matches').select('*').eq('id', mid).single();
  if (error || !m){ toast(authErr(error), true); return; }
  const amA = m.player_a === S.me.id;
  const oppId = amA ? m.player_b : m.player_a;
  const { data: opp } = await S.sb.from('profiles').select('*').eq('id', oppId).maybeSingle();
  const M = S.match = {
    id: mid, m, amA, oppId, ranked: m.ranked,
    opp: opp || { display_name: '?', elo: amA ? m.elo_b_before : m.elo_a_before },
    pendingIce: [], rtcOk: false, oppSeen: false, phase: 'connect', dead: false,
    selfS: [], oppS: [], timers: [], lastFrameAt: 0, status: t('m_connect'), big: 'VS'
  };
  renderShell();
  if (!await ensureCam()){ await S.sb.rpc('cancel_match', { p_match: mid }); exitMatch(); return; }
  attach($('#vMe'), S.stream);
  const ch = S.sb.channel('mog-match-' + mid, { config: { broadcast: { self: false, ack: false }, presence: { key: S.me.id } } });
  M.ch = ch;
  ch.on('broadcast', { event: 'sig' }, ({ payload }) => onSig(M, payload))
    .on('broadcast', { event: 'frame' }, ({ payload }) => onFrame(M, payload))
    .on('broadcast', { event: 'hello' }, () => onOppSeen(M))
    .on('broadcast', { event: 'go' }, () => { onOppSeen(M); if (!M.amA) runBattle(M); })
    .on('broadcast', { event: 'bye' }, () => onBye(M))
    .on('presence', { event: 'sync' }, () => { const st = ch.presenceState(); if (st && st[M.oppId]) onOppSeen(M); })
    .subscribe(async status => {
      if (M.dead) return;
      if (status === 'SUBSCRIBED'){
        try { await ch.track({ uid: S.me.id, at: Date.now() }); } catch(e){}
        send(M, 'hello', {});
      }
    });
  M.timers.push(setTimeout(() => { if (!M.oppSeen && !M.dead) noShow(M); }, 25000));
}

function onOppSeen(M){
  if (M.oppSeen || M.dead) return;
  M.oppSeen = true;
  send(M, 'hello', {});
  setStatus(M, t('m_video'));
  getPC(M);
  if (M.amA) makeOffer(M);
  // если p2p не поднялось за 4 с, шлём кадры через сервер Supabase (работает в любой сети)
  M.timers.push(setTimeout(() => startRelay(M), 4000));
  if (M.amA){
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (M.dead || M.phase !== 'connect'){ clearInterval(iv); return; }
      const el = Date.now() - t0;
      if ((M.rtcOk && el > 1200) || (M.lastFrameAt && el > 5000) || el > 8000){
        clearInterval(iv); send(M, 'go', {}); runBattle(M);
      }
    }, 250);
    M.timers.push(iv);
  } else {
    M.timers.push(setTimeout(() => { if (M.phase === 'connect' && !M.dead) runBattle(M); }, 15000));
  }
}
function rtcState(M){
  const pc = M.pc; if (!pc) return;
  const ok = pc.connectionState ? pc.connectionState === 'connected' : ['connected','completed'].includes(pc.iceConnectionState);
  M.rtcOk = ok;
  updateOppMedia(M);
  if ((pc.connectionState === 'failed' || pc.iceConnectionState === 'failed') && M.amA && !M.dead && !M.restarted){
    M.restarted = true; makeOffer(M, true);
  }
}
function getPC(M){
  if (M.pc) return M.pc;
  const pc = new RTCPeerConnection({ iceServers: CONFIG.ICE });
  M.pc = pc;
  S.stream.getTracks().forEach(tr => pc.addTrack(tr, S.stream));
  pc.onicecandidate = e => { if (e.candidate) send(M, 'sig', { t: 'ice', c: e.candidate.toJSON() }); };
  pc.ontrack = e => {
    M.remoteStream = (e.streams && e.streams[0]) || new MediaStream([e.track]);
    attach($('#vOpp'), M.remoteStream); updateOppMedia(M);
  };
  pc.onconnectionstatechange = () => rtcState(M);
  pc.oniceconnectionstatechange = () => rtcState(M);
  return pc;
}
async function makeOffer(M, restart){
  const pc = getPC(M);
  try{
    const offer = await pc.createOffer(restart ? { iceRestart: true } : undefined);
    await pc.setLocalDescription(offer);
    const sdp = { type: pc.localDescription.type, sdp: pc.localDescription.sdp };
    send(M, 'sig', { t: 'offer', sdp });
    // повторяем оффер, если ответ потерялся
    M.timers.push(setTimeout(() => { if (!M.dead && pc.signalingState === 'have-local-offer') send(M, 'sig', { t: 'offer', sdp }); }, 3000));
  } catch(e){ console.warn('offer', e); }
}
async function flushIce(M){
  const list = M.pendingIce.splice(0);
  for (const c of list){ try { await M.pc.addIceCandidate(c); } catch(e){} }
}
async function onSig(M, p){
  if (M.dead || !p) return;
  onOppSeen(M);
  const pc = getPC(M);
  try{
    if (p.t === 'offer'){
      if (M.lastOffer === p.sdp.sdp) return;
      M.lastOffer = p.sdp.sdp;
      await pc.setRemoteDescription(p.sdp);
      await flushIce(M);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      send(M, 'sig', { t: 'answer', sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
    } else if (p.t === 'answer'){
      if (pc.signalingState === 'have-local-offer'){ await pc.setRemoteDescription(p.sdp); await flushIce(M); }
    } else if (p.t === 'ice' && p.c){
      if (pc.remoteDescription && pc.remoteDescription.type) await pc.addIceCandidate(p.c).catch(() => {});
      else M.pendingIce.push(p.c);
    }
  } catch(e){ console.warn('sig', e); }
}
const RCAN = document.createElement('canvas');
function startRelay(M){
  if (M.dead || M.relayIv) return;
  M.relayIv = setInterval(() => {
    if (M.dead || M.phase === 'done' || M.rtcOk) return;
    const v = $('#vMe'); if (!v || !v.videoWidth) return;
    const w = 240, h = Math.round(240 * v.videoHeight / v.videoWidth);
    RCAN.width = w; RCAN.height = h;
    const c = RCAN.getContext('2d');
    c.drawImage(v, 0, 0, w, h);
    send(M, 'frame', { img: RCAN.toDataURL('image/jpeg', 0.6) });
  }, 450);
}
function onFrame(M, p){
  if (M.dead || !p || !p.img || typeof p.img !== 'string' || !p.img.startsWith('data:image/')) return;
  onOppSeen(M);
  M.lastImg = p.img; M.lastFrameAt = Date.now();
  const img = $('#iOpp'); if (img) img.src = p.img;
  updateOppMedia(M);
}
function updateOppMedia(M){
  const v = $('#vOpp'), img = $('#iOpp'), wait = $('#oWait'), badge = $('#oBadge');
  if (!v) return;
  const useVideo = M.rtcOk && M.remoteStream;
  const useImg = !useVideo && M.lastFrameAt && Date.now() - M.lastFrameAt < 4000;
  v.style.display = useVideo ? '' : 'none';
  img.style.display = useImg ? '' : 'none';
  wait.style.display = useVideo || useImg ? 'none' : '';
  badge.style.display = useVideo || useImg ? '' : 'none';
  badge.textContent = useVideo ? t('m_p2p') : t('m_relay');
}
function oppSource(M){
  const v = $('#vOpp'), img = $('#iOpp');
  if (M.rtcOk && v && v.videoWidth) return v;
  if (img && M.lastFrameAt && Date.now() - M.lastFrameAt < 3000 && img.complete && img.naturalWidth) return img;
  return null;
}

/* =================== МАТЧ: бой =================== */
async function runBattle(M){
  if (M.phase !== 'connect' || M.dead) return;
  M.phase = 'count';
  for (let i = 3; i > 0; i--){ setBig(M, String(i), true); setStatus(M, t('m_face')); await sleep(1000); if (M.dead) return; }
  setBig(M, 'GO', true);
  const fl = await Promise.race([loadFL(), sleep(12000).then(() => null)]);
  if (M.dead) return;
  if (!fl) toast(t('err_model'), true);
  M.hadModel = !!fl; M.phase = 'scan';
  $$('.pane').forEach(p => p.classList.add('scanning'));
  const t0 = Date.now();
  while (Date.now() - t0 < CONFIG.SCAN_MS){
    if (M.dead) return;
    setStatus(M, t('m_scan', { s: Math.max(0, (CONFIG.SCAN_MS - (Date.now() - t0)) / 1000).toFixed(1) }));
    if (fl){
      const a = analyzeEl(fl, $('#vMe')); if (a) M.selfS.push(a);
      const src = oppSource(M); if (src){ const b = analyzeEl(fl, src); if (b) M.oppS.push(b); }
      const A = agg(M.selfS), B = agg(M.oppS);
      const sm = $('#scMe'), so = $('#scOpp');
      if (sm) sm.textContent = A ? A.score.toFixed(1) : '–';
      if (so) so.textContent = B ? B.score.toFixed(1) : '–';
    }
    await sleep(280);
  }
  $$('.pane').forEach(p => p.classList.remove('scanning'));
  finishBattle(M);
}
async function finishBattle(M){
  if (M.dead) return;
  M.phase = 'judge';
  const a = agg(M.selfS), b = agg(M.oppS);
  M.mine = a;
  const pSelf = M.hadModel ? (a ? a.score : 1) : -1;
  const pOpp = M.hadModel && b ? b.score : -1;
  setBig(M, '…'); setStatus(M, t('m_judge'));
  try{
    const { error } = await S.sb.rpc('report_result', { p_match: M.id, p_self: pSelf, p_opp: pOpp, p_breakdown: a ? a.b : {} });
    if (error) throw error;
  } catch(e){ toast(authErr(e), true); }
  send(M, 'done', {});
  pollResult(M);
}
async function pollResult(M){
  const t0 = Date.now();
  while (!M.dead){
    const { data: m } = await S.sb.from('matches').select('*').eq('id', M.id).maybeSingle();
    if (M.dead) return;
    if (m && m.status === 'judged') return showResult(M, m);
    if (m && m.status === 'cancelled'){ toast(t('m_left'), true); return exitMatch(); }
    const el = Date.now() - t0;
    if (el > 4000) setStatus(M, t('m_wait_opp'));
    if (el > 31000) await S.sb.rpc('claim_forfeit', { p_match: M.id }).then(() => {}, () => {});
    if (el > 80000){ toast(t('res_timeout'), true); return exitMatch(); }
    await sleep(1500);
  }
}
async function showResult(M, m){
  M.phase = 'done'; M.final = m;
  stopRtc(M);
  await refreshMe();
  drawResult(M);
}
function drawResult(M){
  const m = M.final; if (!m) return;
  const win = m.winner === S.me.id;
  const myS = Number(M.amA ? m.score_a : m.score_b), opS = Number(M.amA ? m.score_b : m.score_a);
  const before = M.amA ? m.elo_a_before : m.elo_b_before, after = M.amA ? m.elo_a_after : m.elo_b_after;
  const dlt = (after ?? before) - before;
  const forfeit = win && (M.amA ? m.report_b : m.report_a) == null;
  setBig(M, `${myS.toFixed(1)} : ${opS.toFixed(1)}`); setStatus(M, '');
  const sm = $('#scMe'), so = $('#scOpp');
  if (sm) sm.textContent = myS.toFixed(1); if (so) so.textContent = opS.toFixed(1);
  const lv = $('#mLeave'); if (lv) lv.style.display = 'none';
  const b = M.mine ? M.mine.b : null;
  const bars = b ? ['tilt','sym','jaw','thirds','eyes'].map(k => `<div class="barrow"><span>${esc(t('k_'+k))}</span><div class="bar"><i data-v="${clamp01(b[k]/10)}"></i></div><span class="mono">${Number(b[k]).toFixed(1)}</span></div>`).join('') : '';
  $('#mRes').innerHTML = `<div class="result">
    <div><div class="word ${win ? 'win' : ''}">${esc(win ? t('win') : t('lose'))}</div>
      <div class="delta" style="color:${dlt >= 0 ? 'var(--ok)' : 'var(--red-hi)'}">${M.ranked ? (dlt >= 0 ? '+' : '') + dlt + ' ELO' : `<span class="muted" style="font-size:.9rem">${esc(t('casual_note'))}</span>`}</div>
      ${forfeit ? `<div class="muted" style="font-size:.85rem">${esc(t('forfeit'))}</div>` : ''}</div>
    <div class="bars">${bars}</div>
    <div class="res-actions"><button class="btn primary" id="rAgain">${ic('swords')}${esc(t('b_again'))}</button><button class="btn ghost" id="rLobby">${esc(t('b_lobby'))}</button></div>
  </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $$('#mRes .bar i').forEach(i => i.style.setProperty('--v', i.dataset.v))));
  $('#rAgain').onclick = () => { exitMatch(); startSearch(); };
  $('#rLobby').onclick = () => exitMatch();
}
function onBye(M){
  if (M.dead) return;
  if (M.phase === 'connect' || M.phase === 'count'){
    toast(t('m_left'), true);
    S.sb.rpc('cancel_match', { p_match: M.id }).then(() => {}, () => {});
    exitMatch();
  } else { M.oppLeft = true; }
}
async function noShow(M){
  toast(t('m_noshow'));
  await S.sb.rpc('cancel_match', { p_match: M.id }).then(() => {}, () => {});
  exitMatch();
  startSearch();
}
function leaveMatch(M){
  send(M, 'bye', {});
  if (M.phase === 'connect' || M.phase === 'count') S.sb.rpc('cancel_match', { p_match: M.id }).then(() => {}, () => {});
  exitMatch();
}
function stopRtc(M){
  clearInterval(M.relayIv); M.relayIv = null;
  try { if (M.pc) M.pc.close(); } catch(e){}
}
function cleanupMatch(M){
  if (!M) return;
  M.dead = true;
  M.timers.forEach(x => clearTimeout(x));
  stopRtc(M);
  if (M.ch){ try { M.ch.untrack(); } catch(e){} try { S.sb.removeChannel(M.ch); } catch(e){} }
}
function exitMatch(){
  cleanupMatch(S.match);
  S.match = null; S.view = 'arena';
  if (S.me) renderShell();
}
function cleanupAll(){
  if (S.mm) stopSearch(true);
  if (S.match){ cleanupMatch(S.match); S.match = null; }
  if (S.stream){ S.stream.getTracks().forEach(tr => tr.stop()); S.stream = null; }
}

function renderMatch(){
  const M = S.match; if (!M) return;
  const main = $('#main'); if (!main) return renderShell();
  const me = S.me, op = M.opp;
  main.innerHTML = `<section class="view">
    <div class="m-head"><span class="eyebrow">${esc(M.ranked ? t('m_ranked') : t('m_casual'))} · 1 v 1</span><button class="btn sm ghost" id="mLeave">${esc(t('m_leave'))}</button></div>
    <div class="m-stage">
      <figure class="pane me corners" id="pMe"><video id="vMe" autoplay muted playsinline></video>
        <div class="who"><div><div class="nm">${esc(me.display_name)}</div><div class="el">${me.elo} ELO</div></div><div class="score" id="scMe">–</div></div></figure>
      <div class="vs"><div class="m-big" id="mBig">${esc(M.big)}</div><div class="m-status" id="mStatus">${esc(M.status)}</div></div>
      <figure class="pane opp" id="pOpp">
        <div class="wait" id="oWait">${ava(op, 'xl')}<span>${esc(t('m_opp_wait'))}</span></div>
        <video id="vOpp" autoplay muted playsinline style="display:none"></video>
        <img class="relay" id="iOpp" alt="" style="display:none">
        <span class="badge" id="oBadge" style="display:none"></span>
        <div class="who"><div><div class="nm">${esc(op.display_name)}</div><div class="el">${esc(op.elo)} ELO · ${esc(t('fac_' + (op.faculty || 'digital')))}</div></div><div class="score" id="scOpp">–</div></div></figure>
    </div>
    <div id="mRes"></div></section>`;
  if (S.stream) attach($('#vMe'), S.stream);
  if (M.remoteStream) attach($('#vOpp'), M.remoteStream);
  if (M.lastImg) $('#iOpp').src = M.lastImg;
  updateOppMedia(M);
  if (M.phase === 'scan') $$('.pane').forEach(p => p.classList.add('scanning'));
  $('#mLeave').onclick = () => leaveMatch(M);
  if (M.final) drawResult(M);
}

/* =================== РЕЙТИНГ =================== */
async function viewTop(){
  $('#main').innerHTML = `<section class="view"><span class="eyebrow">${esc(t('top_eye'))}</span><h1 class="h-page">${esc(t('top_h'))}</h1><div id="tb"><p class="empty">…</p></div></section>`;
  const { data, error } = await S.sb.from('profiles').select('id,display_name,faculty,avatar_url,elo,wins,losses')
    .order('elo', { ascending: false }).order('wins', { ascending: false }).limit(100);
  const box = $('#tb'); if (!box || S.view !== 'top') return;
  if (error){ box.innerHTML = `<p class="empty">${esc(authErr(error))}</p>`; return; }
  if (!data.length){ box.innerHTML = `<p class="empty">${esc(t('top_empty'))}</p>`; return; }
  box.innerHTML = `<table class="tbl"><thead><tr><th>#</th><th>${esc(t('th_player'))}</th><th class="num">${esc(t('th_elo'))}</th><th class="num hide-sm">${esc(t('th_wl'))}</th><th class="num hide-sm">${esc(t('th_wr'))}</th></tr></thead><tbody>${
    data.map((p, i) => { const g = p.wins + p.losses; return `<tr class="${i < 3 ? 'top3' : ''} ${p.id === S.me.id ? 'mine' : ''}">
      <td class="n">${i + 1}</td>
      <td><div class="pl">${ava(p)}<div>${esc(p.display_name)}<small>${esc(t('fac_' + p.faculty))} · ${esc(t('tier' + tierOf(p.elo)))}</small></div></div></td>
      <td class="num">${p.elo}</td><td class="num hide-sm">${p.wins} / ${p.losses}</td><td class="num hide-sm">${g ? Math.round(p.wins / g * 100) + '%' : '–'}</td></tr>`; }).join('')
  }</tbody></table>`;
}

/* =================== ИСТОРИЯ =================== */
async function viewHist(){
  $('#main').innerHTML = `<section class="view"><span class="eyebrow">${esc(t('hist_eye'))}</span><h1 class="h-page">${esc(t('hist_h'))}</h1><div id="hb"><p class="empty">…</p></div></section>`;
  const id = S.me.id;
  const { data, error } = await S.sb.from('matches')
    .select('*,pa:profiles!matches_player_a_fkey(display_name,avatar_url,elo),pb:profiles!matches_player_b_fkey(display_name,avatar_url,elo)')
    .or(`player_a.eq.${id},player_b.eq.${id}`).eq('status', 'judged').order('judged_at', { ascending: false }).limit(50);
  const box = $('#hb'); if (!box || S.view !== 'hist') return;
  if (error){ box.innerHTML = `<p class="empty">${esc(authErr(error))}</p>`; return; }
  if (!data.length){ box.innerHTML = `<p class="empty">${esc(t('hist_empty'))}</p>`; return; }
  box.innerHTML = `<table class="tbl"><thead><tr><th>${esc(t('th_date'))}</th><th>${esc(t('th_opp'))}</th><th class="num">${esc(t('th_score'))}</th><th>${esc(t('th_res'))}</th><th class="num">${esc(t('th_delta'))}</th></tr></thead><tbody>${
    data.map(m => {
      const a = m.player_a === id, opp = a ? m.pb : m.pa;
      const my = Number(a ? m.score_a : m.score_b), op = Number(a ? m.score_b : m.score_a);
      const before = a ? m.elo_a_before : m.elo_b_before, after = a ? m.elo_a_after : m.elo_b_after;
      const d = m.ranked ? (after ?? before) - before : null;
      const w = m.winner === id;
      return `<tr><td class="muted">${esc(ago(m.judged_at))}</td>
        <td><div class="pl">${ava(opp)}<div>${esc(opp && opp.display_name)}<small>${esc(m.ranked ? t('m_ranked') : t('m_casual'))}</small></div></div></td>
        <td class="num">${my.toFixed(1)} : ${op.toFixed(1)}</td>
        <td class="${w ? 'res-w' : 'res-l'}">${esc(w ? t('r_w') : t('r_l'))}</td>
        <td class="num">${d == null ? '–' : (d >= 0 ? '+' : '') + d}</td></tr>`;
    }).join('')
  }</tbody></table>`;
}

/* =================== ПРОФИЛЬ =================== */
function viewProf(){
  const me = S.me;
  $('#main').innerHTML = `<section class="view"><span class="eyebrow">${esc(S.user.email || '')}</span><h1 class="h-page">${esc(t('prof_h'))}</h1>
    <div class="prof">
      <div class="prof-ava">${ava(me, 'xl')}<label class="btn sm" for="pAvaIn">${ic('camera')}${esc(t('b_ava'))}</label><input type="file" id="pAvaIn" accept="image/*" hidden></div>
      <form class="prof-form" id="pform" novalidate>
        <div class="row2">
          <div class="field"><label for="pn">${esc(t('f_nick'))}</label><input class="input" id="pn" maxlength="24" value="${esc(me.display_name)}"></div>
          <div class="field"><label for="pf">${esc(t('f_fac'))}</label><select class="select" id="pf">${facOptions(me.faculty)}</select></div>
        </div>
        <div class="field"><label for="pb">${esc(t('f_bio'))}</label><textarea class="input" id="pb" maxlength="160" placeholder="${esc(t('ph_bio'))}">${esc(me.bio)}</textarea></div>
        <div class="err" id="aerr"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn primary" type="submit">${esc(t('b_save'))}</button><button class="btn ghost" type="button" id="pLogout">${ic('logout')}${esc(t('b_logout'))}</button></div>
      </form>
    </div></section>`;
  $('#pLogout').onclick = async () => { cleanupAll(); await S.sb.auth.signOut(); };
  $('#pform').onsubmit = async e => {
    e.preventDefault(); setErr('');
    const btn = e.target.querySelector('button[type=submit]');
    const nick = cleanNick($('#pn').value);
    if (nick.length < 2 || nick.length > 24) return setErr(t('err_nick'));
    busy(btn, true);
    try{
      if (nick.toLowerCase() !== String(me.username).toLowerCase() && await nickTaken(nick, me.id)) return setErr(t('err_nick_taken'));
      const { error } = await S.sb.from('profiles').update({ username: nick, display_name: nick, faculty: $('#pf').value, bio: $('#pb').value.slice(0, 160) }).eq('id', me.id);
      if (error) return setErr(error.code === '23505' ? t('err_nick_taken') : authErr(error));
      await refreshMe(); toast(t('saved')); renderShell();
    } finally { busy(btn, false); }
  };
  $('#pAvaIn').onchange = async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try{
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      const path = `${me.id}/avatar.jpg`;
      const up = await S.sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const url = S.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
      const { error } = await S.sb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
      if (error) throw error;
      await refreshMe(); toast(t('saved')); renderShell();
    } catch(err){ toast(authErr(err), true); }
  };
}

boot();
})();
</script>
